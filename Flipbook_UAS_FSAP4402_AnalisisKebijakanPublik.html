      {

            "opts": [
                  "A. Menutup seluruh dokumen kajian dari publik",
                  "B. Transparansi asumsi/metode, kode etik profesi, dan pelibatan partisipasi publik yang bermakna",

            "opts": [

            "opts": [

            "opts": [
                  "A. Efektivitas dan Transparansi Pelayanan Publik",

                  "C. Sentralisasi penuh",
                  "D. Groupthink"

    let userAnswers = {};
    let quizFilter = 'all';

    function renderQuizHTML() {
      const answeredCount = Object.keys(userAnswers).length;
      const correctCount = Object.entries(userAnswers).filter(([qi, oi]) => quizData[qi].ans === oi).length;
      const pct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

      const filtered = quizData.map((item, qi) => ({ item, qi })).filter(({ item, qi }) => {
        if (quizFilter === 'unanswered') return userAnswers[qi] === undefined;
        if (quizFilter === 'wrong') return userAnswers[qi] !== undefined && userAnswers[qi] !== item.ans;
        return true;
      });

      return `
        <div class="space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[var(--border,#cbd5e1)] pb-3">
            <div>
              <h2 class="text-xl font-bold">Simulasi Kuis UAS (${quizData.length} Soal)</h2>
              <p class="text-xs text-[var(--muted-foreground,#475569)]">Dijawab: <strong>${answeredCount}/${quizData.length}</strong> • Benar: <strong class="text-emerald-600">${correctCount}</strong> • Akurasi: <strong>${pct}%</strong></p>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 text-xs">
              <button onclick="setFilter('all')" class="px-2.5 py-1 rounded-lg border ${quizFilter==='all'?'bg-[var(--primary,#1d4ed8)] text-white border-transparent font-bold':'border-[var(--border,#cbd5e1)]'}">Semua (${quizData.length})</button>
              <button onclick="setFilter('unanswered')" class="px-2.5 py-1 rounded-lg border ${quizFilter==='unanswered'?'bg-[var(--primary,#1d4ed8)] text-white border-transparent font-bold':'border-[var(--border,#cbd5e1)]'}">Belum (${quizData.length - answeredCount})</button>
              <button onclick="setFilter('wrong')" class="px-2.5 py-1 rounded-lg border ${quizFilter==='wrong'?'bg-[var(--primary,#1d4ed8)] text-white border-transparent font-bold':'border-[var(--border,#cbd5e1)]'}">Salah</button>
              <button onclick="resetQuiz()" class="px-2.5 py-1 rounded-lg border border-rose-400 text-rose-600 hover:bg-rose-50 font-semibold">Reset</button>
            </div>
          </div>
          <div class="space-y-3 max-h-[440px] overflow-y-auto pr-1">
            ${filtered.length === 0 ? '<p class="text-xs text-center py-8 text-[var(--muted-foreground,#475569)]">Tidak ada soal pada filter ini.</p>' : filtered.map(({ item, qi }) => {
              const ua = userAnswers[qi];
              const isDone = ua !== undefined;
              return `
              <div class="p-3.5 rounded-xl border border-[var(--border,#cbd5e1)] bg-[var(--background,#f8fafc)] space-y-2 text-xs">
                <p class="font-semibold leading-relaxed">${item.q}</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                  ${item.opts.map((opt, oi) => {
                    let cls = "border-[var(--border,#cbd5e1)] hover:bg-[var(--secondary,#e2e8f0)]";
                    if (isDone) {
                      if (oi === item.ans) cls = "border-emerald-600 bg-emerald-600 text-white font-bold";
                      else if (oi === ua && ua !== item.ans) cls = "border-rose-600 bg-rose-600 text-white";
                      else cls = "border-[var(--border,#cbd5e1)] opacity-60";
                    }
                    return `<button ${isDone?'disabled':''} onclick="checkAns(${qi}, ${oi})" class="text-left px-3 py-1.5 rounded-lg border transition ${cls}">${opt}</button>`;
                  }).join('')}
                </div>
                ${isDone ? `<p class="text-[11px] p-2 rounded bg-[var(--secondary,#e2e8f0)]">${ua === item.ans ? '✓ Benar! ' : '✗ Kurang tepat. '}${item.exp}</p>` : ''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    function setFilter(f) { quizFilter = f; renderPage(); }
    function resetQuiz() { userAnswers = {}; quizFilter = 'all'; renderPage(); }
    function checkAns(qi, oi) { userAnswers[qi] = oi; renderPage(); }

    let current = 0;
    function renderPage() {
      const container = document.getElementById('pageContent');
      container.classList.remove('flip-enter');
      void container.offsetWidth;
      container.classList.add('flip-enter');
      container.innerHTML = pages[current].render();
      document.getElementById('pageBadge').textContent = `${current + 1} / ${pages.length}`;
      document.getElementById('progressBar').style.width = `${((current + 1) / pages.length) * 100}%`;
      document.getElementById('prevBtn').disabled = current === 0;
      document.getElementById('nextBtn').disabled = current === pages.length - 1;
      renderToc();
    }

    function renderToc() {
      const toc = document.getElementById('tocDrawer');
      toc.innerHTML = pages.map((p, idx) => `
        <button onclick="goTo(${idx})" class="text-left p-2 rounded-lg border text-xs transition ${idx === current ? 'border-[var(--primary)] bg-[var(--secondary)] font-bold' : 'border-[var(--border)] hover:bg-[var(--secondary)]'}">
          <div class="text-[10px] text-[var(--muted-foreground)]">${p.tag}</div>
          <div class="truncate">${p.title}</div>
        </button>
      `).join('');
    }

    function toggleToc() { document.getElementById('tocDrawer').classList.toggle('hidden'); }
    function goTo(idx) { current = idx; renderPage(); document.getElementById('tocDrawer').classList.add('hidden'); }
    function nextPage() { if (current < pages.length - 1) { current++; renderPage(); } }
    function prevPage() { if (current > 0) { current--; renderPage(); } }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

    renderPage();
  </script>
</body>
